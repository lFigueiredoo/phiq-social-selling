name: Social Selling CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: panel-web/package-lock.json
      - run: npm ci
      - run: npm run check

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local database and apply every migration
        run: supabase start --exclude studio,imgproxy,inbucket,realtime,storage-api,edge-runtime,logflare,vector
      - name: Database tests
        run: supabase test db
      - name: Database lint
        run: supabase db lint --local --level warning
      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup

